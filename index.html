<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaMha</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef0f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(34, 5, 5, 0.1);
            width: 100%;
            max-width: 350px;
        }

        /* ชื่อเว็บ MaMha */
        .logo {
            text-align: center;
            color: #831b1b; 
            margin-bottom: 20px;
        }

        .logo h1 {
            margin: 0;
            font-size: 28px;
        }

        .logo p {
            margin: 5px 0 0 0;
            color: #777;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box; 
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #ca4f4f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #da8d8d;
        }

        /* ลิงก์สลับหน้า */
        .links {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
        }

        .links a {
            color: #da8d8d;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">
            <h1>(ตรงนี้ใส่โลโก้)MaMha</h1>
            <p>ตรงนี้อาจจะใส่ยินดีต้อนรับ ไม่ก็สโลแกนเท่ๆ</p>
        </div>

        <form id="login-form">
            <h4 style="text-align: center;">เข้าสู่ระบบ</h4>
            
            <div class="input-group">
                <label for="login-email">อีเมล / ชื่อผู้ใช้</label>
                <input type="email" id="login-email" placeholder="กรอกอีเมลของคุณ" required>
            </div>

            <div class="input-group">
                <label for="login-password">รหัสผ่าน</label>
                <input type="password" id="login-password" placeholder="กรอกรหัสผ่าน" required>
            </div>

            <button type="submit" class="btn">เข้าสู่ระบบ</button>

            <div class="links">
                <a href="#" onclick="showPage('forgot-form')">ลืมรหัสผ่าน?</a> | 
                <a href="#" onclick="showPage('register-form')">สมัครสมาชิก</a>
            </div>
        </form>

        <form id="register-form" class="hidden">
            <h4 style="text-align: center;">สมัครสมาชิก</h4>

            <div class="input-group">
                <label for="reg-username">ชื่อผู้ใช้</label>
                <input type="text" id="reg-username" placeholder="ตั้งชื่อผู้ใช้" required>
            </div>

            <div class="input-group">
                <label for="reg-email">อีเมล</label>
                <input type="email" id="reg-email" placeholder="example@mamha.com" required>
            </div>

            <div class="input-group">
                <label for="reg-password">รหัสผ่าน</label>
                <input type="password" id="reg-password" placeholder="ตั้งรหัสผ่าน" required>
            </div>

            <button type="submit" class="btn">ยืนยัน</button>

            <div class="links">
                มีบัญชีอยู่แล้ว? <a href="#" onclick="showPage('login-form')">เข้าสู่ระบบ</a>
            </div>
        </form>

        <form id="forgot-form" class="hidden">
            <h3 style="text-align: center;">ลืมรหัสผ่าน</h3>
            <p style="font-size: 12px; color: #666; text-align: center;">กรอกอีเมลที่ใช้สมัคร</p>

            <div class="input-group">
                <label for="forgot-email">อีเมลของคุณ</label>
                <input type="email" id="forgot-email"  required>
            </div>

            <button type="submit" class="btn">รับลิ้งค์รีเซ็ตรหัสผ่าน</button>

            <div class="links">
                <a href="#" onclick="showPage('login-form')">กลับหน้าเข้าสู่ระบบ</a>
            </div>
        </form>
    </div>

    <script>
        function showPage(pageId) {
            // ซ่อนฟอร์มทั้งหมดก่อน
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-form').classList.add('hidden');
            document.getElementById('forgot-form').classList.add('hidden');

            // แสดงเฉพาะฟอร์มที่กดเลือก
            document.getElementById(pageId).classList.remove('hidden');
            // เขียนเป็นแค่นี้เพราะเพิ่งเรียนจาว่าเมื่อกี้นะเพื่อนๆTT
        }
    </script>

</body>
</html>
